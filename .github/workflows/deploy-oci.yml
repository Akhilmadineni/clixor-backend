name: Deploy OCI

run-name: Deploy clixor-backend ${{ github.event.workflow_run.head_sha }} to OCI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: clixor-backend-oci-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, clixor-oci-production]
    timeout-minutes: 90
    steps:
      - name: Deploy the CI-approved revision from root-owned source
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          approval_audience="clixor-oci-production:${DEPLOY_SHA}:${SOURCE_RUN_ID}:${DEPLOY_RUN_ID}:${DEPLOY_RUN_ATTEMPT}"
          response_file="${RUNNER_TEMP}/clixor-oidc-response-${DEPLOY_RUN_ID}-${DEPLOY_RUN_ATTEMPT}.json"
          token_file="${RUNNER_TEMP}/clixor-oidc-token-${DEPLOY_RUN_ID}-${DEPLOY_RUN_ATTEMPT}"
          cleanup() {
            rm -f -- "${response_file}" "${token_file}"
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --max-time 15 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${approval_audience}" \
            --output "${response_file}"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")).get("value"); print(value) if isinstance(value,str) and value else sys.exit("missing OIDC token")' \
            "${response_file}" > "${token_file}"
          sudo -n /usr/local/sbin/clixor-actions-deploy \
            "${DEPLOY_SHA}" "${SOURCE_RUN_ID}" "${DEPLOY_RUN_ID}" "${DEPLOY_RUN_ATTEMPT}" \
            < "${token_file}"
