name: Deploy NAS

run-name: Deploy clixor-backend ${{ github.event.workflow_run.head_sha }} to NAS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clixor-backend-nas-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run is privileged and targets a self-hosted NAS runner. Never
    # execute a pull-request checkout (including a fork branch named `main`).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, nas, clixor]
    timeout-minutes: 60
    steps:
      - name: Check out the CI-approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: true
          persist-credentials: false

      - name: Build, migrate, and deploy on the NAS
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: deploy/nas/deploy.sh "$GITHUB_WORKSPACE" "$DEPLOY_SHA" "$DEPLOY_RUN_ID"
