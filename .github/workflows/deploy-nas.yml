name: Deploy NAS

run-name: Deploy clixor-backend ${{ github.event.workflow_run.head_sha }} to NAS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clixor-backend-nas-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, nas, clixor]
    timeout-minutes: 60
    steps:
      - name: Check out the CI-approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: true
          persist-credentials: false

      - name: Build, migrate, and deploy on the NAS
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: deploy/nas/deploy.sh "$GITHUB_WORKSPACE" "$DEPLOY_SHA" "$DEPLOY_RUN_ID"

      - name: Verify public ingress
        run: curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 5 --max-time 10 https://clustr-api.atlanteanz.com/health/ready
