name: Configure Clixor legal hostname

run-name: Configure clixor.atlanteanz.com on the NAS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clixor-cloudflare-hostname
  cancel-in-progress: false

jobs:
  configure:
    runs-on: [self-hosted, nas, clixor]
    timeout-minutes: 10
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          persist-credentials: false

      - name: Configure the local Cloudflare Tunnel route
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            deploy/nas/configure-legal-hostname.sh
          elif sudo -n true 2>/dev/null; then
            sudo -n deploy/nas/configure-legal-hostname.sh
          else
            docker run --rm --privileged --pid=host \
              --env HOST_WORKSPACE="$GITHUB_WORKSPACE" \
              alpine:3.22 sh -ec '
                apk add --no-cache util-linux >/dev/null
                exec nsenter --target 1 --mount --uts --ipc --net --pid --root --wd=/ -- \
                  "$HOST_WORKSPACE/deploy/nas/configure-legal-hostname.sh"
              '
          fi

      - name: Verify branded legal pages
        run: |
          curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 --max-time 10 https://clixor.atlanteanz.com/privacy >/dev/null
          curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 5 --max-time 10 https://clixor.atlanteanz.com/terms >/dev/null
