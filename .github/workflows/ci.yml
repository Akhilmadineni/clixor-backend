name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clustr_test
          POSTGRES_USER: clustr
          POSTGRES_PASSWORD: clustr-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clustr -d clustr_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://clustr:clustr-test-password@127.0.0.1:5432/clustr_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"
          cache: true
      - name: Reject retired NAS automation
        run: |
          test ! -e .github/workflows/deploy-nas.yml
          test ! -e .github/workflows/configure-legal-hostname.yml
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race-enabled tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/...

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: clustr-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  oci-terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/oci/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize the locked OCI provider
        run: terraform init -backend=false -input=false
      - name: Validate the OCI Resource Manager stack
        run: terraform validate -no-color
      - name: Check OCI deployment entrypoints
        run: sh -n ../actions-deploy.sh ../bootstrap.sh ../deploy.sh ../install-cloudflared-service.sh ../install-oci-cli.sh ../backup.sh ../offsite-backup.sh
      - name: Test OCI public smoke harness offline
        run: python3 -m unittest -v ../test_smoke.py
      - name: Check the data-volume mount helper
        run: bash -n clixor-mount-data.sh
      - name: Verify the break-glass upload bundle
        run: |
          ./package-stack.sh /tmp/clixor-oci-resource-manager.zip
          unzip -t /tmp/clixor-oci-resource-manager.zip
