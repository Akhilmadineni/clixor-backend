<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Open invite in Clixor</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5ff;
      color: #1a1523;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    main {
      width: min(100%, 34rem);
      padding: 2rem;
      border: 1px solid #e8e4f2;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgba(91, 33, 182, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.7rem; }
    p { margin: 0.5rem 0; color: #5b5566; line-height: 1.55; }
    .brand { color: #7c3aed; font-weight: 800; letter-spacing: -0.02em; }
    @media (prefers-color-scheme: dark) {
      :root { background: #120f18; color: #f4f0fa; }
      main { background: #1c1724; border-color: #2e273a; }
      p { color: #b7b0c4; }
      .brand { color: #c4b5fd; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Clixor</p>
    <h1>Open this invite in the app</h1>
    <p>Open this link on an iPhone with Clixor installed to review the group invitation.</p>
    <p>For your privacy, invite codes are handled by the app and are never displayed by this website.</p>
  </main>
</body>
</html>
