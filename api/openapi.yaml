openapi: 3.1.0
info:
  title: Clustr API
  version: 0.1.0
  description: Production messaging and shared-group API. The current production-05b transition message format is plaintext-equivalent at the server and is not E2EE; clixor-e2ee-v1 is the encrypted successor.
servers:
  - url: https://api.clustr.example/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Credentials"}
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResponse"}
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Credentials"}
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResponse"}
  /auth/refresh:
    post:
      security: []
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        "200":
          description: Rotated token pair
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
  /auth/password/reset/start:
    post:
      security: []
      operationId: startPasswordReset
      description: Returns the same delayed response for known and unknown accounts. A code is sent only for an existing password account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "202":
          description: Generic reset challenge response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasswordResetChallenge"}
        "429": {description: Per-address or per-IP abuse limit reached; an earlier delivered challenge remains valid}
        "503": {description: Password reset or a dependency is unavailable}
  /auth/password/reset/confirm:
    post:
      security: []
      operationId: confirmPasswordReset
      description: Consumes a one-time emailed code, replaces the password, and revokes every existing session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, code, new_password]
              properties:
                challenge_id: {type: string, format: uuid}
                code: {type: string, pattern: "^[0-9]{8}$"}
                new_password: {type: string, minLength: 10, maxLength: 256}
      responses:
        "204": {description: Password changed and sessions revoked}
        "400": {description: Invalid, expired, consumed, or attempt-limited code}
        "422": {description: New password does not meet policy}
        "429": {description: Per-IP abuse limit reached}
        "503": {description: Password reset or a dependency is unavailable}
  /auth/phone/start:
    post:
      security: []
      operationId: startPhoneVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: {type: string, pattern: "^\\+[1-9][0-9]{7,14}$"}
      responses:
        "202": {description: Verification pending}
        "429":
          description: Destination cooldown, lockout, or fraud budget reached
          headers:
            Retry-After: {schema: {type: integer}}
        "503": {description: Phone verification is not configured}
  /auth/phone/verify:
    post:
      security: []
      operationId: verifyPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, device_name, platform]
              properties:
                phone: {type: string}
                code: {type: string}
                device_id: {type: string, format: uuid}
                device_name: {type: string}
                platform: {type: string, enum: [ios, android, web]}
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResponse"}
        "401": {description: Invalid or expired single-use code}
        "429":
          description: Guess limit or destination lockout reached
          headers:
            Retry-After: {schema: {type: integer}}
  /webhooks/telnyx/messaging:
    post:
      security: []
      operationId: receiveTelnyxMessagingWebhook
      description: Ed25519-signed SMS delivery events. Payloads are never logged or persisted.
      parameters:
        - in: header
          name: telnyx-signature-ed25519
          required: true
          schema: {type: string}
        - in: header
          name: telnyx-timestamp
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: Event accepted or already processed}
        "401": {description: Invalid signature or replay window}
  /me:
    get:
      operationId: me
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
    patch:
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfilePatch"}
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
    delete:
      operationId: deleteAccount
      description: Irreversibly deletes authentication and discovery data, removes group memberships, and preserves shared financial history under a Deleted user tombstone.
      responses:
        "204": {description: Account deleted and all sessions revoked}
        "401": {description: Access token is missing, invalid, or already revoked}
  /me/age-assurance:
    get:
      operationId: getAgeAssurance
      description: Returns the current adults-only policy decision. Missing, stale, or expired assurance is reported as pending.
      responses:
        "200":
          description: Current age-assurance state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgeAssurance"}
    put:
      operationId: putAgeAssurance
      description: Evaluates an Apple Declared Age Range result or a fallback date-of-birth attestation. Exact birth dates are processed transiently and never persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: "#/components/schemas/AppleAgeAssuranceRequest"}
                - {$ref: "#/components/schemas/SelfAttestedAgeAssuranceRequest"}
      responses:
        "200":
          description: Age decision stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgeAssurance"}
        "422": {description: Invalid or inconsistent age evidence}
        "429": {description: Underage-to-adult recheck cooldown is active}
  /me/avatar:
    post:
      operationId: createProfileMediaUpload
      description: Creates a user-scoped profile image upload of at most 20 MiB. Completing the upload verifies both size and SHA-256, then atomically activates it as the current avatar.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileMediaUploadRequest"}
      responses:
        "201":
          description: Short-lived profile image upload URL
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaUploadResponse"}
  /me/phone/start:
    post:
      operationId: startPhoneLink
      description: Sends an OTP to attach a verified phone number to the signed-in account (as opposed to /auth/phone/start, which signs in/up).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: {type: string, pattern: "^\\+[1-9][0-9]{7,14}$"}
      responses:
        "202": {description: Verification pending}
  /me/phone/verify:
    post:
      operationId: verifyPhoneLink
      description: Verifies the OTP and links the phone number to the signed-in account so friends can find them via contact lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: {type: string}
                code: {type: string}
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "409": {description: Phone number already linked to another account}
  /devices/{device_id}:
    put:
      operationId: upsertDevice
      parameters:
        - {$ref: "#/components/parameters/DeviceID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, platform]
              properties:
                name: {type: string}
                platform: {type: string}
                push_token: {type: string}
                identity_key: {type: string, description: Base64 public identity key}
                signed_prekey: {$ref: "#/components/schemas/SignedPreKey"}
      responses:
        "200":
          description: Device registered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
  /devices/{device_id}/prekeys:
    put:
      operationId: uploadPrekeys
      parameters:
        - {$ref: "#/components/parameters/DeviceID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys:
                  type: array
                  maxItems: 1000
                  items: {$ref: "#/components/schemas/PreKey"}
      responses:
        "204": {description: Prekeys stored}
  /users/{user_id}/prekeys:claim:
    post:
      operationId: claimPrekeys
      parameters:
        - {$ref: "#/components/parameters/UserID"}
      responses:
        "200":
          description: Prekey bundles for every linked device; available one-time prekeys are atomically consumed
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: {$ref: "#/components/schemas/PreKeyBundle"}
  /conversations:
    get:
      operationId: listConversations
      parameters:
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Conversation page
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Page"}
                  - {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Conversation"}}}}
    post:
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, member_ids]
              properties:
                kind: {type: string, enum: [direct, group]}
                title: {type: string, maxLength: 200}
                member_ids: {type: array, maxItems: 1023, items: {type: string, format: uuid}}
                metadata: {type: object, additionalProperties: true}
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Conversation"}
  /conversations/{conversation_id}/members:
    get:
      operationId: listConversationMembers
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
      responses:
        "200": {description: Current conversation membership}
    post:
      operationId: addConversationMember
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {type: string, format: uuid}
                role: {type: string, enum: [member, admin]}
      responses:
        "204": {description: Member added or role updated}
  /conversations/{conversation_id}/members/{user_id}:
    delete:
      operationId: removeConversationMember
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
        - {$ref: "#/components/parameters/UserID"}
      responses:
        "204": {description: Member removed}
  /conversations/{conversation_id}/owner:
    put:
      operationId: transferConversationOwnership
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {type: string, format: uuid}
      responses:
        "204": {description: Ownership transferred atomically}
  /conversations/{conversation_id}/invites:
    post:
      operationId: createConversationInvite
      description: Creates a bounded group invite. The high-entropy token is returned once and only its SHA-256 hash is retained.
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_in_seconds:
                  type: integer
                  format: int64
                  minimum: 300
                  maximum: 2592000
                  default: 604800
                max_uses:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 25
      responses:
        "201":
          description: Invite created; token will not be returned again
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationInviteCreation"}
        "403": {description: Owner or admin role required}
        "422": {description: Invalid bounds or direct conversation}
  /conversations/{conversation_id}/invites/{invite_id}:
    delete:
      operationId: revokeConversationInvite
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
        - {$ref: "#/components/parameters/InviteID"}
      responses:
        "204": {description: Invite revoked; repeated revocation is idempotent}
        "403": {description: Owner or admin role required}
        "404": {description: Invite does not belong to this conversation}
  /invites/preview:
    post:
      operationId: previewConversationInvite
      description: Returns a privacy-safe preview without conversation IDs, metadata, creator identity, members, usage counters, or a bearer token in the URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConversationInviteTokenRequest"}
      responses:
        "200":
          description: Active invite preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationInvitePreview"}
        "404": {description: Token is malformed or unknown}
        "410": {description: Invite is revoked, expired, or exhausted}
  /invites/accept:
    post:
      operationId: acceptConversationInvite
      description: Atomically joins the authenticated user. The bearer remains in the encrypted JSON body; existing membership is an idempotent no-op and does not consume a use.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConversationInviteTokenRequest"}
      responses:
        "200":
          description: Conversation membership is available
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationInviteAcceptance"}
        "404": {description: Token is malformed or unknown}
        "410": {description: Invite is revoked, expired, or has no uses available for a new member}
  /conversations/{conversation_id}/messages:
    get:
      operationId: listMessages
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
        - name: before_seq
          in: query
          description: Return the newest messages with sequence numbers lower than this cursor. Mutually exclusive with after_seq.
          schema: {type: integer, format: int64, minimum: 1}
        - name: after_seq
          in: query
          description: Return the oldest messages with sequence numbers higher than this cursor. Mutually exclusive with before_seq.
          schema: {type: integer, format: int64, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        "200":
          description: Messages in ascending sequence order. With no cursor, returns the latest page. next_cursor is the first sequence for latest/before pages and the last sequence for after pages.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Message"}
                  next_cursor:
                    type: string
                    description: Pass as before_seq for history paging or after_seq for catch-up paging.
        "422": {description: Invalid cursor combination, cursor value, or limit}
    post:
      operationId: sendMessage
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SendMessage"}
      responses:
        "201":
          description: Accepted idempotent message
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /conversations/{conversation_id}/receipt:
    put:
      operationId: updateReceipt
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivered_seq, read_seq]
              properties:
                delivered_seq: {type: integer, format: int64, minimum: 0}
                read_seq: {type: integer, format: int64, minimum: 0}
      responses:
        "200": {description: Monotonic receipt updated}
  /conversations/{conversation_id}/receipts:
    get:
      operationId: listReceipts
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
      responses:
        "200": {description: Current delivery and read watermarks for conversation members}
  /conversations/{conversation_id}/entities/{kind}:
    get:
      operationId: listEntities
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
        - {$ref: "#/components/parameters/EntityKind"}
        - {name: since, in: query, schema: {type: string, format: date-time}}
      responses:
        "200": {description: Incremental entity page}
  /conversations/{conversation_id}/entities/{kind}/{entity_id}:
    put:
      operationId: putEntity
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
        - {$ref: "#/components/parameters/EntityKind"}
        - {name: entity_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/ExpectedVersion"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: Versioned entity stored}
    delete:
      operationId: deleteEntity
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
        - {$ref: "#/components/parameters/EntityKind"}
        - {name: entity_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/ExpectedVersion"}
      responses:
        "204": {description: Tombstone created}
  /conversations/{conversation_id}/media:
    post:
      operationId: createMediaUpload
      description: Creates a production-05b-compatible conversation upload of at most 1 GiB. content_type is optional and defaults to application/octet-stream.
      parameters:
        - {$ref: "#/components/parameters/ConversationID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConversationMediaUploadRequest"}
      responses:
        "201":
          description: Short-lived encrypted upload URL
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaUploadResponse"}
  /media/{media_id}/complete:
    post:
      operationId: completeMediaUpload
      description: Profile media (at most 20 MiB) is verified by size and SHA-256. During production-05b compatibility, conversation media is verified by size only; its declared SHA-256 is stored but not checked by the server. Newer clients authenticate and decrypt conversation ciphertext client-side rather than relying on server digest verification.
      parameters:
        - {name: media_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Media verified and ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaObject"}
        "422": {description: Object size does not match, or profile-media SHA-256 does not match, the declaration}
  /media/{media_id}/download:
    get:
      operationId: mediaDownload
      parameters:
        - {name: media_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Short-lived download URL}
  /media/{media_id}:
    delete:
      operationId: deleteMedia
      description: Revokes owner access immediately and queues durable object deletion.
      parameters:
        - {name: media_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Media deletion queued}
  /realtime:
    get:
      operationId: realtime
      description: Upgrade to WebSocket. Events are at-least-once and deduplicated by ID.
      responses:
        "101": {description: Switching Protocols}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ConversationID: {name: conversation_id, in: path, required: true, schema: {type: string, format: uuid}}
    InviteID: {name: invite_id, in: path, required: true, schema: {type: string, format: uuid}}
    DeviceID: {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
    UserID: {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    EntityKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [profile, expense, task, file, chore, feed_item, recurring_expense, settlement, group_meta, payment_handles, trip_plan, check_in]
    ExpectedVersion:
      name: expected_version
      in: query
      required: true
      description: Current version for optimistic concurrency, or 0 when creating
      schema: {type: integer, format: int64, minimum: 0}
  schemas:
    ConversationMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [byte_size, ciphertext_sha256]
      properties:
        byte_size: {type: integer, format: int64, minimum: 1, maximum: 1073741824}
        ciphertext_sha256: {type: string, pattern: "^[0-9a-fA-F]{64}$"}
        content_type: {type: string, maxLength: 100}
    ProfileMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [byte_size, ciphertext_sha256]
      properties:
        byte_size: {type: integer, format: int64, minimum: 1, maximum: 20971520}
        ciphertext_sha256: {type: string, pattern: "^[0-9a-fA-F]{64}$"}
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/heic, image/webp]
          default: image/jpeg
    MediaObject:
      type: object
      required: [id, owner_id, scope, content_type, byte_size, ciphertext_sha256, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        scope: {type: string, enum: [conversation, profile]}
        content_type: {type: string}
        byte_size: {type: integer, format: int64}
        ciphertext_sha256: {type: string, pattern: "^[0-9a-fA-F]{64}$"}
        status: {type: string, enum: [pending, ready, deleted]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MediaUploadResponse:
      type: object
      required: [media, upload]
      properties:
        media: {$ref: "#/components/schemas/MediaObject"}
        upload:
          type: object
          required: [method, url, headers, expires_at]
          properties:
            method: {type: string, const: PUT}
            url: {type: string, format: uri}
            headers: {type: object, additionalProperties: {type: string}}
            expires_at: {type: string, format: date-time}
    Credentials:
      type: object
      required: [email, password, device_name, platform]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 10, maxLength: 256}
        display_name: {type: string, maxLength: 100}
        device_id: {type: string, format: uuid}
        device_name: {type: string}
        platform: {type: string}
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_at]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_at: {type: string, format: date-time}
    AuthResponse:
      type: object
      required: [user, device, tokens]
      properties:
        user: {$ref: "#/components/schemas/User"}
        device: {$ref: "#/components/schemas/Device"}
        tokens: {$ref: "#/components/schemas/TokenPair"}
    PasswordResetChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_in_seconds, message]
      properties:
        challenge_id: {type: string, format: uuid}
        expires_in_seconds: {type: integer, minimum: 300, maximum: 1800}
        message: {type: string}
    User:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        phone: {type: string}
        display_name: {type: string}
        avatar_url: {type: string, format: uri}
        profile: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProfilePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Atomic sparse merge. Omitted fields are preserved; null clears an optional field. New clients change profile media through /me/avatar; production 05b may replay or attach an owned ready media reference with profile_image_url.
      properties:
        display_name: {type: string, minLength: 1, maxLength: 100}
        contact_email:
          oneOf: [{type: string, format: email, maxLength: 254}, {type: "null"}]
        contact_phone:
          oneOf: [{type: string, maxLength: 32}, {type: "null"}]
        avatar_color:
          oneOf: [{type: string, pattern: "^#[0-9A-Fa-f]{6}$"}, {type: "null"}]
        username:
          oneOf: [{type: string, maxLength: 31}, {type: "null"}]
        bio:
          oneOf: [{type: string, maxLength: 500}, {type: "null"}]
        auto_settle_settings:
          oneOf: [{type: object, additionalProperties: true}, {type: "null"}]
        profile_image_url:
          description: Deprecated compatibility field for the production 05b client. New values must be ready, account-owned clustr-media references; new clients use /me/avatar.
          oneOf: [{type: string, maxLength: 2048}, {type: "null"}]
    AgeAssurance:
      type: object
      required: [status, minimum_age, policy_version]
      properties:
        status: {type: string, enum: [pending, adult, underage]}
        minimum_age: {type: integer, const: 18}
        source: {type: string, enum: [apple_declared_age_range, self_attested_date_of_birth]}
        declaration: {type: string}
        policy_version: {type: string, const: adult-v1}
        checked_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    AppleAgeAssuranceRequest:
      type: object
      additionalProperties: false
      required: [source, declaration]
      properties:
        source: {type: string, const: apple_declared_age_range}
        lower_bound: {type: integer, minimum: 0, maximum: 125}
        upper_bound: {type: integer, minimum: 1, maximum: 126}
        declaration:
          type: string
          enum: [not_provided, self_declared, guardian_declared, confirmed, checked_by_other_method, guardian_checked_by_other_method, government_id_checked, guardian_government_id_checked, payment_checked, guardian_payment_checked]
    SelfAttestedAgeAssuranceRequest:
      type: object
      additionalProperties: false
      required: [source, declaration, date_of_birth]
      properties:
        source: {type: string, const: self_attested_date_of_birth}
        declaration: {type: string, const: self_declared}
        date_of_birth: {type: string, format: date}
    Device:
      type: object
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        name: {type: string}
        platform: {type: string}
        identity_key: {type: string}
        signed_prekey: {$ref: "#/components/schemas/SignedPreKey"}
    SignedPreKey:
      type: object
      required: [key_id, public_key, signature]
      additionalProperties: false
      properties:
        key_id: {type: integer, minimum: 0}
        public_key: {type: string, contentEncoding: base64}
        signature: {type: string, contentEncoding: base64}
    PreKey:
      type: object
      required: [key_id, public_key]
      additionalProperties: false
      properties:
        key_id: {type: integer, minimum: 0}
        public_key: {type: string, contentEncoding: base64}
    PreKeyBundle:
      type: object
      required: [device_id, identity_key, signed_prekey]
      properties:
        device_id: {type: string, format: uuid}
        identity_key: {type: string, contentEncoding: base64}
        signed_prekey: {$ref: "#/components/schemas/SignedPreKey"}
        one_time_prekey: {$ref: "#/components/schemas/PreKey"}
    Conversation:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [direct, group]}
        title: {type: string}
        metadata: {type: object, additionalProperties: true}
        last_seq: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ConversationInvite:
      type: object
      additionalProperties: false
      required: [id, conversation_id, created_by, max_uses, uses, expires_at, created_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        created_by: {type: string, format: uuid}
        max_uses: {type: integer, minimum: 1, maximum: 1000}
        uses: {type: integer, minimum: 0}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    ConversationInviteCreation:
      type: object
      additionalProperties: false
      required: [token, invite]
      properties:
        token:
          type: string
          pattern: "^cinv_[A-Za-z0-9_-]{43}$"
          description: One-time-visible 256-bit bearer secret; do not log or persist it.
        invite: {$ref: "#/components/schemas/ConversationInvite"}
    ConversationInviteTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: "^cinv_[A-Za-z0-9_-]{43}$"
          description: High-entropy bearer secret carried only in the TLS-protected request body.
    ConversationInvitePreview:
      type: object
      additionalProperties: false
      required: [invite_id, kind, expires_at, already_member]
      properties:
        invite_id: {type: string, format: uuid}
        kind: {type: string, const: group}
        title: {type: string}
        avatar_url: {type: string}
        expires_at: {type: string, format: date-time}
        already_member: {type: boolean}
    ConversationInviteAcceptance:
      type: object
      additionalProperties: false
      required: [conversation, joined]
      properties:
        conversation: {$ref: "#/components/schemas/Conversation"}
        joined: {type: boolean}
    SendMessage:
      type: object
      required: [client_message_id, content_type, ciphertext, envelope]
      properties:
        id: {type: string, format: uuid}
        client_message_id: {type: string, minLength: 8, maxLength: 128}
        content_type: {type: string, enum: [text, image, video, audio, file, location]}
        ciphertext: {type: string, contentEncoding: base64}
        envelope:
          oneOf:
            - {$ref: "#/components/schemas/E2EEEnvelope"}
            - {$ref: "#/components/schemas/Production05bTransitionEnvelope"}
        reply_to_id: {type: string, format: uuid}
    Production05bTransitionEnvelope:
      type: object
      deprecated: true
      additionalProperties: false
      required: [protocol]
      description: Temporary compatibility envelope for the installed production-05b app. Ciphertext is base64-encoded JSON, plaintext-equivalent at the server, and not end-to-end encrypted.
      properties:
        protocol: {type: string, const: clustr-transition-v1}
    E2EEEnvelope:
      type: object
      additionalProperties: false
      required: [protocol, version, sender_identity_key, sender_ephemeral_key, recipients, signature]
      properties:
        protocol: {type: string, const: clixor-e2ee-v1}
        version: {type: integer, const: 1}
        sender_identity_key: {type: string, contentEncoding: base64}
        sender_ephemeral_key: {type: string, contentEncoding: base64}
        recipients:
          type: array
          minItems: 1
          maxItems: 4096
          items:
            type: object
            additionalProperties: false
            required: [device_id, key_id, wrapped_key]
            properties:
              device_id: {type: string, format: uuid}
              key_id: {type: integer, minimum: 1}
              wrapped_key: {type: string, contentEncoding: base64}
        signature: {type: string, contentEncoding: base64}
    Message:
      allOf:
        - {$ref: "#/components/schemas/SendMessage"}
        - type: object
          properties:
            conversation_id: {type: string, format: uuid}
            sender_id: {type: string, format: uuid}
            sender_device_id: {type: string, format: uuid}
            seq: {type: integer, format: int64}
            created_at: {type: string, format: date-time}
            server_received_at: {type: string, format: date-time}
    Page:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {}}
        next_cursor: {type: string}
