apiVersion: v1
kind: Secret
metadata:
  name: clustr-api
  namespace: clustr
type: Opaque
stringData:
  CLUSTER_DATABASE_URL: postgres://USER:PASSWORD@HOST:5432/clustr?sslmode=require
  CLUSTER_REDIS_URL: rediss://:PASSWORD@HOST:6379/0
  CLUSTER_NATS_URL: tls://HOST:4222
  CLUSTER_JWT_ACCESS_SECRET: replace-with-at-least-32-random-bytes
  CLUSTER_METRICS_TOKEN: replace-with-a-distinct-32-byte-random-secret
  CLUSTER_S3_ENDPOINT: s3.example.com
  CLUSTER_S3_ACCESS_KEY: replace-me
  CLUSTER_S3_SECRET_KEY: replace-me
  CLUSTER_OTP_HMAC_SECRET: replace-with-a-distinct-48-byte-random-secret
  CLUSTER_TELNYX_API_KEY: replace-me
  CLUSTER_TELNYX_FROM_NUMBER: "+13125550100"
  CLUSTER_TELNYX_MESSAGING_PROFILE_ID: replace-me
  CLUSTER_TELNYX_PUBLIC_KEY: replace-with-base64-ed25519-public-key
  CLUSTER_APNS_TEAM_ID: replace-me
  CLUSTER_APNS_KEY_ID: replace-me
  CLUSTER_APNS_PRIVATE_KEY_FILE: /var/run/secrets/clustr-apns/AuthKey.p8
