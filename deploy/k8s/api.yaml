apiVersion: v1
kind: Namespace
metadata:
  name: clustr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clustr-api
  namespace: clustr
data:
  CLUSTER_ENV: production
  CLUSTER_HTTP_ADDR: ":8080"
  CLUSTER_PUBLIC_BASE_URL: https://api.clustr.app
  CLUSTER_STORE: postgres
  CLUSTER_AUTO_MIGRATE: "false"
  CLUSTER_ACCESS_TTL: 15m
  CLUSTER_REFRESH_TTL: 720h
  CLUSTER_JWT_ISSUER: clustr-api
  CLUSTER_S3_BUCKET: clustr-media
  CLUSTER_S3_USE_TLS: "true"
  CLUSTER_VERIFICATION_PROVIDER: telnyx
  CLUSTER_OTP_CODE_LENGTH: "6"
  CLUSTER_OTP_CHALLENGE_TTL: 10m
  CLUSTER_OTP_RESEND_COOLDOWN: 1m
  CLUSTER_OTP_LOCKOUT_TTL: 15m
  CLUSTER_OTP_MAX_ATTEMPTS: "5"
  CLUSTER_OTP_PHONE_SEND_HOURLY: "5"
  CLUSTER_OTP_PHONE_SEND_DAILY: "10"
  CLUSTER_OTP_GLOBAL_SEND_MINUTE: "60"
  CLUSTER_OTP_GLOBAL_SEND_DAILY: "10000"
  CLUSTER_APNS_ENVIRONMENT: production
  CLUSTER_APNS_BUNDLE_ID: com.Clustr.Clustr.Clustr
  CLUSTER_PUSH_DELIVERY_BATCH_SIZE: "100"
  CLUSTER_PUSH_WORKER_CONCURRENCY: "16"
  CLUSTER_PUSH_MAX_ATTEMPTS: "8"
  CLUSTER_PUSH_RETRY_BASE_DELAY: 2s
  CLUSTER_PUSH_RETRY_MAX_DELAY: 15m
  CLUSTER_PUSH_DELIVERED_RETENTION: 24h
  CLUSTER_PUSH_DEAD_LETTER_RETENTION: 720h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clustr-api
  namespace: clustr
  labels:
    app.kubernetes.io/name: clustr-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clustr-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clustr-api
    spec:
      serviceAccountName: clustr-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: clustr-api
      containers:
        - name: api
          image: ghcr.io/replace-me/clustr-api:replace-with-immutable-sha
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: clustr-api
            - secretRef:
                name: clustr-api
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: apns-key
              mountPath: /var/run/secrets/clustr-apns
              readOnly: true
      volumes:
        - name: apns-key
          secret:
            secretName: clustr-apns-key
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clustr-api
  namespace: clustr
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: clustr-api
  namespace: clustr
spec:
  selector:
    app.kubernetes.io/name: clustr-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clustr-api
  namespace: clustr
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clustr-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clustr-api
  namespace: clustr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clustr-api
  minReplicas: 3
  maxReplicas: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clustr-api
  namespace: clustr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clustr-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 9000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 9000
