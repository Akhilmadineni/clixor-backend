worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  # Never log query strings: secure conversation-invite universal links carry
  # their one-time token in the query for compatibility with installed iOS
  # clients. `$uri` is the normalized path only; `$request` and `$request_uri`
  # would persist the credential. Restrict Nginx error output as it can echo the
  # full request line for upstream warnings; application logs retain bounded,
  # query-free request diagnostics.
  log_format clixor_json escape=json
    '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time}';
  access_log /dev/stdout clixor_json;
  error_log /dev/stderr crit;
  client_max_body_size 2m;
  client_body_timeout 35s;
  send_timeout 90s;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream clixor_api {
    zone clixor_api 64k;
    least_conn;
    server api-a:8080 resolve max_fails=2 fail_timeout=5s;
    server api-b:8080 resolve max_fails=2 fail_timeout=5s;
    keepalive 64;
  }

  # The only full API listener is a filesystem-authenticated Unix socket.
  # /run/clixor-origin is root:clixor-origin 0750 on the host and this process
  # runs with that numeric group. Only cloudflared is enrolled in the group;
  # the Host and CF-Connecting-IP values are trusted only after that boundary.
  server {
    listen unix:/run/clixor-origin/gateway.sock default_server;
    server_name _;
    return 421;
  }

  server {
    listen unix:/run/clixor-origin/gateway.sock;
    server_name clustr-api.atlanteanz.com clixor.atlanteanz.com;

    location / {
      # The directory is a persistent root-owned host bind mounted read-only.
      # Absence is the safe state across process and machine restarts. Nginx
      # can stat but cannot create, remove, replace, or rename this capability.
      if (!-f /run/clixor-origin-gate/public-open) {
        return 503 "clixor-origin-gate-closed\n";
      }
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_set_header Host $host;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://clixor_api;
    }
  }

  server {
    # Canary stays usable while the independent production capability is
    # absent, so exact release evidence and recovery probes remain possible.
    listen unix:/run/clixor-origin/gateway.sock;
    server_name clixor-oci-canary.atlanteanz.com;

    location / {
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_set_header Host $host;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://clixor_api;
    }
  }

  server {
    # Docker/host health probes deliberately expose no application routes and
    # never accept a caller-supplied Cloudflare identity.
    listen 8080;
    server_name _;

    location = /health/live {
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto http;
      proxy_pass http://clixor_api;
    }
    location = /health/ready {
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto http;
      proxy_pass http://clixor_api;
    }
    location / { return 404; }
  }
}
