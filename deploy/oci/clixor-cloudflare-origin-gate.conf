# Persistent capability directory. The optional public-open marker is created
# only by the root promotion controller and is bind-mounted read-only to Nginx.
d /var/lib/clixor 0700 root root -
d /var/lib/clixor/origin-gate-public 0755 root root -
z /var/lib/clixor/origin-gate-public/public-open 0400 root root -
z /var/lib/clixor/cloudflare-origin-gate.json 0400 root root -
