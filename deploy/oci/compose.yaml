name: clixor-oci

x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  logging: *local-logging
  ulimits:
    core:
      soft: 0
      hard: 0

services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    container_name: clixor-oci-postgres
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/postgres-tls/server.crt
      - -c
      - ssl_key_file=/run/postgres-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
    environment:
      POSTGRES_DB: clixor
      POSTGRES_USER: clixor
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres.password
    networks:
      clixor_data:
      clixor_service:
        aliases:
          - postgres.clixor.internal
    volumes:
      - /srv/clixor/data/postgres:/var/lib/postgresql/data
      - /run/clixor/secrets/active/postgres.password:/run/secrets/postgres.password:ro
      - /run/clixor/secrets/active/postgres.pgpass:/run/secrets/postgres.pgpass:ro
      - /srv/clixor/runtime/postgres-tls/current/server.crt:/run/postgres-tls/server.crt:ro
      - /srv/clixor/runtime/postgres-tls/current/server.key:/run/postgres-tls/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    # Docker is not the boot authority. The stable current-release reconciler
    # starts this exact model only after pinned secrets and bundle validation.
    restart: "no"
    shm_size: 512m
    mem_limit: 3g
    cpus: 1.25
    <<: *service-security

  redis:
    image: redis:8.0.3-alpine@sha256:25c0ae32c6c2301798579f5944af53729766a18eff5660bbef196fc2e6214a9c
    container_name: clixor-oci-redis
    user: "999:1000"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aclfile
      - /run/secrets/redis.acl
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    networks:
      - clixor_data
    volumes:
      - /srv/clixor/data/redis:/data
      - /run/clixor/secrets/active/redis.password:/run/secrets/redis.password:ro
      - /run/clixor/secrets/active/redis.acl:/run/secrets/redis.acl:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis.password) redis-cli ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: "no"
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 0.40
    <<: *service-security

  nats:
    image: nats:2.11.6-alpine@sha256:7dec3f8f1ff181975dbdfc0d903d2a9724659648294dbc2ebb2fa3a294d573a6
    container_name: clixor-oci-nats
    user: "1000:1000"
    command:
      - --config
      - /run/secrets/nats.conf
    networks:
      clixor_data:
      clixor_service:
        aliases:
          - nats.clixor.internal
    volumes:
      - /srv/clixor/data/nats:/data
      - /run/clixor/secrets/active/nats.conf:/run/secrets/nats.conf:ro
      - /srv/clixor/runtime/nats-tls/current/server.crt:/run/nats-tls/server.crt:ro
      - /srv/clixor/runtime/nats-tls/current/server.key:/run/nats-tls/server.key:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: "no"
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.40
    <<: *service-security

  dependency-tls:
    image: haproxy:3.2-alpine@sha256:d9b40affba6af8411bc661e8743877b3d40b1dc5c4b88b26bf1ef00214f2cd71
    container_name: clixor-oci-dependency-tls
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      clixor_data:
      clixor_service:
        aliases:
          - clixor-tls
    volumes:
      - /srv/clixor/runtime/dependency-tls/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /srv/clixor/runtime/dependency-tls/current/server.pem:/run/pki/server.pem:ro
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.15
    <<: *service-security

  migrate:
    profiles: ["migration"]
    image: clixor-api:${CLIXOR_IMAGE_TAG:?set CLIXOR_IMAGE_TAG to an immutable OCI release tag}
    pull_policy: never
    entrypoint: ["/clustr-migrate"]
    environment:
      CLUSTER_CONFIG_FILE: /run/secrets/migrate.env
    depends_on:
      dependency-tls:
        condition: service_healthy
    networks:
      - clixor_service
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    restart: "no"
    volumes:
      - /srv/clixor/secrets/pki/ca.crt:/run/pki/ca.crt:ro
      - /run/clixor/secrets/active/migrate.env:/run/secrets/migrate.env:ro
    <<: *service-security

  api-a:
    image: clixor-api:${CLIXOR_IMAGE_TAG:?set CLIXOR_IMAGE_TAG to an immutable OCI release tag}
    pull_policy: never
    container_name: clixor-oci-api-a
    environment:
      CLUSTER_CONFIG_FILE: /run/secrets/api.env
      CLUSTER_TRUSTED_PROXY_CIDRS: 172.30.254.2/32
    depends_on:
      dependency-tls:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      clixor_service:
      clixor_ingress:
        ipv4_address: 172.30.254.3
      clixor_egress:
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 0.75
    stop_grace_period: 30s
    volumes:
      - /srv/clixor/secrets/pki/ca.crt:/run/pki/ca.crt:ro
      - /run/clixor/secrets/active/api.env:/run/secrets/api.env:ro
      - /run/clixor/secrets/active/apns:/run/secrets/apns:ro
    <<: *service-security

  api-b:
    image: clixor-api:${CLIXOR_IMAGE_TAG:?set CLIXOR_IMAGE_TAG to an immutable OCI release tag}
    pull_policy: never
    container_name: clixor-oci-api-b
    environment:
      CLUSTER_CONFIG_FILE: /run/secrets/api.env
      CLUSTER_TRUSTED_PROXY_CIDRS: 172.30.254.2/32
    depends_on:
      dependency-tls:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      clixor_service:
      clixor_ingress:
        ipv4_address: 172.30.254.4
      clixor_egress:
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 0.75
    stop_grace_period: 30s
    volumes:
      - /srv/clixor/secrets/pki/ca.crt:/run/pki/ca.crt:ro
      - /run/clixor/secrets/active/api.env:/run/secrets/api.env:ro
      - /run/clixor/secrets/active/apns:/run/secrets/apns:ro
    <<: *service-security

  api-gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: clixor-oci-api-gateway
    # GID 987 is the host clixor-origin group. The gateway creates its Unix
    # socket group-accessible only to the connector identity.
    user: "986:987"
    command: ["/bin/sh", "-c", "umask 007 && exec nginx -g 'daemon off;'"]
    depends_on:
      - api-a
      - api-b
    networks:
      clixor_ingress:
        ipv4_address: 172.30.254.2
    volumes:
      - /srv/clixor/runtime/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: /run/clixor-origin
        target: /run/clixor-origin
        bind:
          # Never let Docker create an absent boot-time trust boundary as
          # root:root with daemon defaults.
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: "no"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=986,gid=987,mode=0750
      - /var/run:size=4m,uid=986,gid=987,mode=0750
      - /tmp:size=16m
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.15
    <<: *service-security

  postgres-backup:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    container_name: clixor-oci-postgres-backup
    user: "0:0"
    environment:
      POSTGRES_DB: clixor
      POSTGRES_USER: clixor
      PGPASSFILE: /run/secrets/postgres.pgpass
    entrypoint: ["/bin/sh", "/opt/clixor/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clixor_service
    volumes:
      - /srv/clixor/runtime/postgres-backup/backup.sh:/opt/clixor/backup.sh:ro
      - /srv/clixor/secrets/pki/ca.crt:/run/pki/ca.crt:ro
      - /run/clixor/secrets/active/postgres.pgpass:/run/secrets/postgres.pgpass:ro
      - /srv/clixor/backups:/backups
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.30
    <<: *service-security

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    container_name: clixor-oci-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
    networks:
      - clixor_service
    volumes:
      - /srv/clixor/runtime/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /run/clixor/secrets/active/metrics.token:/run/secrets/metrics.token:ro
      - /srv/clixor/data/prometheus:/prometheus
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 768m
    cpus: 0.30
    <<: *service-security

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    container_name: clixor-oci-grafana
    user: "472:472"
    environment:
      GF_PATHS_CONFIG: /run/secrets/grafana.ini
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      - clixor_service
    volumes:
      - /srv/clixor/data/grafana:/var/lib/grafana
      - /run/clixor/secrets/active/grafana.ini:/run/secrets/grafana.ini:ro
      - /srv/clixor/runtime/grafana/datasource.yml:/etc/grafana/provisioning/datasources/clixor.yml:ro
    restart: "no"
    mem_limit: 512m
    cpus: 0.30
    <<: *service-security

networks:
  clixor_data:
    internal: true
  clixor_service:
    internal: true
  clixor_ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.254.0/29
  # Only the API replicas need outbound APNs, Telnyx, and Apple identity access.
  # No proxy or data service joins this bridge, preserving the trusted-proxy edge.
  clixor_egress:
