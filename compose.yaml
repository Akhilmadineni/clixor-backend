name: clustr

services:
  api:
    build:
      context: .
    environment:
      CLUSTER_ENV: development
      CLUSTER_HTTP_ADDR: :8080
      CLUSTER_PUBLIC_BASE_URL: http://localhost:8080
      CLUSTER_STORE: postgres
      CLUSTER_DATABASE_URL: postgres://clustr:${POSTGRES_PASSWORD}@postgres:5432/clustr?sslmode=disable
      CLUSTER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLUSTER_NATS_URL: nats://nats:4222
      CLUSTER_JWT_ACCESS_SECRET: ${CLUSTER_JWT_ACCESS_SECRET}
      CLUSTER_METRICS_TOKEN: ${CLUSTER_METRICS_TOKEN:-}
      CLUSTER_S3_ENDPOINT: minio:9000
      CLUSTER_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      CLUSTER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CLUSTER_S3_BUCKET: clustr-media
      CLUSTER_S3_USE_TLS: "false"
      CLUSTER_VERIFICATION_PROVIDER: ${CLUSTER_VERIFICATION_PROVIDER:-disabled}
      CLUSTER_OTP_HMAC_SECRET: ${CLUSTER_OTP_HMAC_SECRET:-}
      CLUSTER_OTP_CODE_LENGTH: ${CLUSTER_OTP_CODE_LENGTH:-6}
      CLUSTER_OTP_CHALLENGE_TTL: ${CLUSTER_OTP_CHALLENGE_TTL:-10m}
      CLUSTER_OTP_RESEND_COOLDOWN: ${CLUSTER_OTP_RESEND_COOLDOWN:-1m}
      CLUSTER_OTP_LOCKOUT_TTL: ${CLUSTER_OTP_LOCKOUT_TTL:-15m}
      CLUSTER_OTP_MAX_ATTEMPTS: ${CLUSTER_OTP_MAX_ATTEMPTS:-5}
      CLUSTER_OTP_PHONE_SEND_HOURLY: ${CLUSTER_OTP_PHONE_SEND_HOURLY:-5}
      CLUSTER_OTP_PHONE_SEND_DAILY: ${CLUSTER_OTP_PHONE_SEND_DAILY:-10}
      CLUSTER_OTP_GLOBAL_SEND_MINUTE: ${CLUSTER_OTP_GLOBAL_SEND_MINUTE:-60}
      CLUSTER_OTP_GLOBAL_SEND_DAILY: ${CLUSTER_OTP_GLOBAL_SEND_DAILY:-10000}
      CLUSTER_OTP_ALLOWED_PREFIXES: ${CLUSTER_OTP_ALLOWED_PREFIXES:-}
      CLUSTER_TELNYX_API_KEY: ${CLUSTER_TELNYX_API_KEY:-}
      CLUSTER_TELNYX_FROM_NUMBER: ${CLUSTER_TELNYX_FROM_NUMBER:-}
      CLUSTER_TELNYX_MESSAGING_PROFILE_ID: ${CLUSTER_TELNYX_MESSAGING_PROFILE_ID:-}
      CLUSTER_TELNYX_PUBLIC_KEY: ${CLUSTER_TELNYX_PUBLIC_KEY:-}
      CLUSTER_APNS_TEAM_ID: ${CLUSTER_APNS_TEAM_ID:-}
      CLUSTER_APNS_KEY_ID: ${CLUSTER_APNS_KEY_ID:-}
      CLUSTER_APNS_BUNDLE_ID: com.Clustr.Clustr.Clustr
      CLUSTER_APNS_PRIVATE_KEY_FILE: ${CLUSTER_APNS_PRIVATE_KEY_FILE:-}
      CLUSTER_APNS_ENVIRONMENT: sandbox
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${CLUSTER_APNS_HOST_KEY_FILE:-/dev/null}:${CLUSTER_APNS_PRIVATE_KEY_FILE:-/tmp/no-apns-key}:ro

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: clustr
      POSTGRES_USER: clustr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clustr -d clustr"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.0.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2.11.6-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
